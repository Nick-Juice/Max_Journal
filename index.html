<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4169e1">
  <meta name="description" content="Sign in to MAX Journal.">
  <title>Sign in · MAX Journal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode">
      <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
    </button>
    <section class="login-card" aria-labelledby="welcomeTitle">
      <img class="brand-logo" src="public/max-logo.png" alt="MAX Journal">
      <p class="eyebrow">YOUR PERSONAL SPACE</p>
      <h1 id="welcomeTitle">Welcome back</h1>
      <p class="intro">Sign in to continue to your journal.</p>

      <form id="loginForm">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>

        <div class="password-heading">
          <label for="password">Password</label>
          <a href="#" id="forgotLink">Forgot password?</a>
        </div>
        <div class="password-wrap">
          <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required minlength="6">
          <button class="show-password" id="showPassword" type="button" aria-label="Show password">Show</button>
        </div>

        <label class="remember"><input type="checkbox" name="remember"> <span>Remember me</span></label>
        <button class="submit-button" type="submit">Sign in <span aria-hidden="true">→</span></button>
        <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
      </form>
      <p class="signup">New to MAX Journal? <a href="#" id="signupLink">Create an account</a></p>
    </section>
    <p class="footer-note">A little space to reflect, plan, and grow.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
